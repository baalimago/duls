name: Simple Go Pipeline - release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# The shared workflow creates the GitHub release and uploads the artifacts.
permissions:
  contents: write

jobs:
  call-workflow:
    uses: baalimago/simple-go-pipeline/.github/workflows/release.yml@4db15db8a791280dfac87dfc23a7f6464ad86e4d
    with:
      go-version: "1.26.5"
      project-name: duls
      branch: master
      version-var: "github.com/baalimago/duls/internal/app.Version"
