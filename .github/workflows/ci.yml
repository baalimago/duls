name: qa

# One job mirrors the one command a developer runs locally: `make qa` runs
# `make lint` and `make test`, every Go test, no subset, no skips.
# Actions are pinned by full commit SHA.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"

jobs:
  qa:
    name: qa
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - name: make lint
        run: make lint
      - name: make test
        run: make test
